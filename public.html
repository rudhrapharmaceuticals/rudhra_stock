<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDHRA PHARMACEUTICALS — Public Stock</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f8fb;color:#102a43}.wrap{max-width:1000px;margin:auto;padding:0 16px}header{background:linear-gradient(135deg,#075b91,#0b8f8f);color:#fff;padding:28px 0 24px;border-radius:0 0 24px 24px}h1{margin:0;font-size:27px}header p{margin:7px 0 0;opacity:.9}.search{margin-top:18px}.search input{width:100%;padding:14px;border:0;border-radius:13px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #102a4310}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#6b7c93}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #d7e2ea;background:#fff;border-radius:999px;padding:9px 13px}.filters button.active{background:#075b91;color:#fff}.list{display:grid;gap:12px}.card h3{margin:0 0 6px;font-size:17px}.meta{color:#66788a;font-size:13px}.qty{font-size:22px;font-weight:700;margin-top:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;margin-left:5px}.ok{background:#e6f7ee;color:#16784b}.zero{background:#fff4db;color:#9a6500}.review{background:#fde9e9;color:#a52a2a}.batch{border-top:1px solid #edf2f5;padding-top:10px;margin-top:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;font-size:13px}.notice{background:#eef7fb;border:1px solid #cfe7f1;border-radius:12px;padding:11px 13px;margin:12px 0;font-size:13px;color:#31566a}footer{text-align:center;color:#718096;padding:28px 0;font-size:12px}@media(max-width:700px){.batch{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}} </style><script src="published-data.js?v=2"></script></head><body><header><div class="wrap"><h1>RUDHRA PHARMACEUTICALS</h1><p>Public Stock Availability Dashboard • Read Only</p><div class="search"><input id="q" placeholder="Search medicine or batch number…"></div></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="meds">0</b><span>Medicines</span></div><div class="stat"><b id="batches">0</b><span>Batch records</span></div><div class="stat"><b id="system">0</b><span>System Qty</span></div><div class="stat"><b id="rack">0</b><span>Rack Qty</span></div><div class="stat"><b id="samples">0</b><span>Samples Given</span></div><div class="stat"><b id="damaged">0</b><span>Damaged Qty</span></div></div><div class="notice" id="publishedAt">Loading published stock…</div><div class="filters"><button class="active" data-view="system">System Qty</button><button data-view="rack">Rack Qty</button><button data-view="samples">Samples</button><button data-view="damaged">Damaged</button></div><div id="list" class="list"></div><footer>Cross-device published read-only stock view • RUDHRA PHARMACEUTICALS</footer></main><script>
const P=window.RUDHRA_PUBLISHED||{data:[],samples:[],racks:{},damages:[],systemByMedicine:{}};const D=P.data||[],S=P.samples||[],R=P.racks||{},G=P.damages||{},Y=P.systemByMedicine||{};const normalizeName=v=>String(v??"").replace(/\s+/g," ").trim().toUpperCase();const systemQty=x=>{const k=Object.keys(Y).find(k=>normalizeName(k)===normalizeName(x.n));return k===undefined?Math.max(0,+x.s||0):Math.max(0,+Y[k]||0)};let view="system";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const key=x=>x.n+"||"+x.b;const sample=x=>S.filter(a=>a.m===x.n&&a.b===x.b).reduce((a,v)=>a+(+v.q||0),0);const damage=x=>G.filter(a=>a.m===x.n&&a.b===x.b).reduce((a,v)=>a+(+v.q||0),0);const rack=x=>R[key(x)];const expected=x=>(+x.s||0)-sample(x)-damage(x);
function render(){let q=($("q").value||"").toLowerCase(),rows=D.filter(x=>!q||x.n.toLowerCase().includes(q)||String(x.b).toLowerCase().includes(q));$("meds").textContent=new Set(D.map(x=>x.n)).size;$("batches").textContent=D.length;$("system").textContent=D.reduce((a,x)=>a+systemQty(x),0).toLocaleString("en-IN");$("rack").textContent=Object.values(R).reduce((a,v)=>a+(+v||0),0).toLocaleString("en-IN");$("samples").textContent=S.reduce((a,x)=>a+(+x.q||0),0).toLocaleString("en-IN");$("damaged").textContent=G.reduce((a,x)=>a+(+x.q||0),0).toLocaleString("en-IN");$("publishedAt").innerHTML="<b>Published data:</b> "+esc(P.publishedAt||"Initial stock source")+" — read-only public view.";if(view==="samples"){let h=S.slice().reverse().map(a=>'<div class="card"><h3>'+esc(a.m)+' <span class="pill ok">Sample</span></h3><div class="meta">Batch: '+esc(a.b)+' • Expiry: '+esc(a.e||"-")+'</div><div class="qty">'+a.q+' units</div><div class="meta">Recipient: '+esc(a.who||"-")+' • Date: '+esc(a.d||"-")+'</div></div>').join("");$("list").innerHTML=h||'<div class="card">No published sample entries.</div>';return}if(view==="damaged"){let h=G.slice().reverse().map(a=>'<div class="card"><h3>'+esc(a.m)+' <span class="pill review">Damaged</span></h3><div class="meta">Batch: '+esc(a.b)+' • Expiry: '+esc(a.e||"-")+'</div><div class="qty">'+a.q+' units</div><div class="meta">Reason: '+esc(a.note||"-")+' • Date: '+esc(a.d||"-")+'</div></div>').join("");$("list").innerHTML=h||'<div class="card">No published damaged entries.</div>';return}let groups={};rows.forEach(x=>(groups[x.n]||(groups[x.n]=[])).push(x));let h=Object.keys(groups).sort().map(n=>{let a=groups[n],total=a.reduce((z,x)=>z+(+(view==="rack"?(rack(x)??0):x.s)||0),0);let batches=a.map(x=>{let q=view==="rack"?(+rack(x)||0):systemQty(x);return '<div class="batch"><div><b>Batch:</b> '+esc(x.b||"-")+'</div><div><b>Expiry:</b> '+esc(x.e||"-")+'</div><div><b>'+ (view==="rack"?"Rack Qty":"System Qty")+':</b> '+q.toLocaleString("en-IN")+'</div><div><b>Expected:</b> '+expected(x).toLocaleString("en-IN")+'</div></div>'}).join("");return '<div class="card"><h3>'+esc(n)+'</h3><div class="qty">'+total.toLocaleString("en-IN")+' units</div><div class="meta">'+a.length+' batch record'+(a.length>1?'s':'')+'</div>'+batches+'</div>'}).join("");$("list").innerHTML=h||'<div class="card">No matching stock records.</div>'}
$("q").oninput=render;document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()});render();
</script></body></html>
