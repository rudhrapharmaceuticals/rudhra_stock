<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b91"><title>RUDHRA PHARMACEUTICALS — Public Stock</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f8fb;color:#102a43}header{background:linear-gradient(135deg,#075b91,#0b8f8f);color:#fff;padding:28px 18px 24px;border-radius:0 0 24px 24px}.wrap{max-width:980px;margin:auto}h1{margin:0;font-size:27px}header p{margin:7px 0 0;opacity:.9}.search{margin-top:20px}.search input{width:100%;padding:14px 16px;border:0;border-radius:13px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 18px #102a4310}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#6b7c93}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #d7e2ea;background:#fff;border-radius:999px;padding:9px 13px}.filters button.active{background:#075b91;color:#fff}.list{display:grid;gap:12px}.card h3{margin:0 0 5px;font-size:17px}.meta{color:#66788a;font-size:13px}.qty{font-size:22px;font-weight:700;margin-top:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;margin-left:5px}.ok{background:#e6f7ee;color:#16784b}.zero{background:#fff4db;color:#9a6500}.review{background:#fde9e9;color:#a52a2a}.batch{border-top:1px solid #edf2f5;padding-top:10px;margin-top:10px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;font-size:13px}footer{text-align:center;color:#718096;padding:28px 0;font-size:12px}@media(max-width:600px){.batch{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="wrap"><h1>RUDHRA PHARMACEUTICALS</h1><p>Public Stock Availability Dashboard</p><div class="search"><input id="q" placeholder="Search medicine or batch number…"></div></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="meds">—</b><span>Medicines</span></div><div class="stat"><b id="batches">—</b><span>Batch records</span></div><div class="stat"><b id="units">—</b><span>System units</span></div></div><div class="filters"><button class="active" data-f="all">All</button><button data-f="available">Available</button><button data-f="zero">Zero</button><button data-f="review">Review</button></div><div id="list" class="list"><div class="card">Loading stock…</div></div><footer>Read-only public stock view • RUDHRA PHARMACEUTICALS</footer></main><script>
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function status(x){return x.s<0?"review":x.s===0?"zero":"available"}
function render(){var q=document.getElementById("q").value.trim().toLowerCase(),f=document.querySelector(".filters .active").dataset.f,d=window.RUDHRA_DATA||[];document.getElementById("meds").textContent=new Set(d.map(function(x){return x.n})).size;document.getElementById("batches").textContent=d.length;document.getElementById("units").textContent=Math.round(d.reduce(function(a,x){return a+x.s},0)).toLocaleString("en-IN");var rows=d.filter(function(x){return !q||x.n.toLowerCase().includes(q)||String(x.b).toLowerCase().includes(q)});if(f!=="all")rows=rows.filter(function(x){return status(x)===f});var groups={};rows.forEach(function(x){(groups[x.n]||(groups[x.n]=[])).push(x)});var html="";Object.keys(groups).sort().forEach(function(n){var a=groups[n],total=a.reduce(function(s,x){return s+x.s},0),st=total>0?"ok":total===0?"zero":"review",label=total>0?"Available":total===0?"Zero":"Review";html+='<div class="card"><h3>'+esc(n)+' <span class="pill '+st+'">'+label+'</span></h3><div class="qty">'+total.toLocaleString("en-IN")+' units</div><div class="meta">'+a.length+' batch record'+(a.length>1?"s":"")+'</div>';a.forEach(function(x){html+='<div class="batch"><div><b>Batch:</b> '+esc(x.b||"—")+'</div><div><b>Expiry:</b> '+esc(x.e||"—")+'</div><div><b>Qty:</b> '+x.s+'</div></div>'});html+="</div>"});document.getElementById("list").innerHTML=html||'<div class="card">No matching stock records.</div>'}
var s=document.createElement("script");s.src="data.js";s.onload=function(){var n=0,t=setInterval(function(){if((window.RUDHRA_DATA||[]).length){clearInterval(t);render()}if(++n>40){clearInterval(t);document.getElementById("list").innerHTML='<div class="card">Unable to load stock data. Please refresh.</div>'}},100)};s.onerror=function(){document.getElementById("list").innerHTML='<div class="card">Unable to load stock data.</div>'};document.body.appendChild(s);
document.getElementById("q").addEventListener("input",render);document.querySelectorAll(".filters button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".filters button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");render()})});
</script></body></html>
