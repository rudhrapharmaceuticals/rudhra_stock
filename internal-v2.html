<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDHRA Stock V2</title><style>body{font-family:Arial;margin:0;background:#f3f7fa;color:#123}header{background:#086b7b;color:white;padding:28px 18px;border-radius:0 0 25px 25px}main{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:white;padding:25px;border-radius:20px}.num{font-size:32px;font-weight:bold}</style></head><body><header><h1>RUDHRA PHARMACEUTICALS</h1><div>Internal Stock Control • Fresh Dashboard</div></header><main><div class="grid"><div class="card"><div class="num" id="m">Loading…</div>Medicines</div><div class="card"><div class="num" id="b">Loading…</div>Batch records</div><div class="card"><div class="num" id="q">Loading…</div>System Qty</div><div class="card"><div class="num" id="s">0</div>Sample Qty</div></div><p id="status">Loading stock data…</p></main><script>const D=[];(async()=>{try{for(let i=1;i<=4;i++){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='data-part'+i+'.js?v=4';s.onload=ok;s.onerror=no;document.body.appendChild(s)})}let d=window.RUDHRA_DATA||[];document.getElementById('m').textContent=new Set(d.map(x=>x.n)).size;document.getElementById('b').textContent=d.length;document.getElementById('q').textContent=d.reduce((a,x)=>a+(+x.s||0),0).toLocaleString('en-IN');document.getElementById('status').textContent='Stock data loaded successfully from the Vyapar batch data.'}catch(e){document.getElementById('status').textContent='Stock data could not be loaded: '+e.message}})();</script></body></html>
