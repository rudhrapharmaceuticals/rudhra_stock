name: Publish stock data to public dashboard

on:
  push:
    paths:
      - "rudhra-publish.json"
      - ".github/workflows/publish-stock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and generate public stock data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("rudhra-publish.json")
          if not source.exists():
              raise SystemExit("rudhra-publish.json is missing. Upload the exported file to the repository root first.")

          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not isinstance(data.get("data", []), list):
              raise SystemExit("Invalid stock export: expected a JSON object containing a data array.")

          serialized = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
          Path("published-data.js").write_text(
              "/* Generated by GitHub Actions from rudhra-publish.json */\n"
              "window.RUDHRA_PUBLISHED=" + serialized + ";\n",
              encoding="utf-8",
          )
          print(f"Generated public data: {len(data.get('data', []))} batch rows")
          PY

      - name: Commit updated public dashboard data
        run: |
          if git diff --quiet -- published-data.js; then
            echo "Public data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published-data.js
          git commit -m "Publish updated stock dashboard data"
          git push
